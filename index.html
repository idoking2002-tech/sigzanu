<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>SIGAZNU</title>
<meta name="description" content="SIGAZNU - ערב משחקי חברה בעברית לטלפון. פותחים חדר, החברים נכנסים עם קוד, משחקים וצוברים נקודות עד שיש אלוף אחד.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single column; smoky lounge at night — charcoal, ash grey, paper white, filter brown, one ember accent */
:root{
  color-scheme:dark;
  --bg:#121110; --bg2:#1a1816; --card:#23201d; --card2:#2b2723; --line:#38332d;
  --fg:#f2ede6; --muted:#a39b91; --paper:#f2ede6; --tan:#c8955a; --brown:#8b5e3c; --ash:#8a847d; --ember:#e8673a;
  --ok:#8fb39a; --bad:#d46a6a;
  --poster:"Karantina","Rubik",system-ui,sans-serif;
  --ui:"Rubik","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden;min-height:100vh;
  background:radial-gradient(80% 50% at 85% -5%,#3a2c2122 0%,transparent 70%),radial-gradient(70% 40% at 0% 20%,#ffffff08 0%,transparent 70%),var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--tan);outline-offset:3px;border-radius:10px}
input{font:inherit}
.muted{color:var(--muted)}
.logo{font-family:var(--poster);font-size:34px;letter-spacing:2px;direction:ltr;display:inline-flex;align-items:center;gap:8px;color:var(--paper);line-height:1}
.logo .stick{display:inline-block;width:30px;height:7px;border-radius:2px;background:linear-gradient(90deg,var(--tan) 0 32%,var(--paper) 32% 90%,var(--ember) 90%);box-shadow:0 0 10px #e8673a66}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#121110e8;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.nav{display:flex;gap:20px;margin-inline-start:auto;font-family:var(--ui);font-weight:600;font-size:15px}
.nav a{color:var(--fg);text-decoration:none;opacity:.85}
.burger{display:none;margin-inline-start:auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);font-size:20px}
.menu{display:grid;padding-block:4px 12px}
.menu a{padding:12px 2px;color:var(--fg);text-decoration:none;font-family:var(--ui);font-weight:600;border-bottom:1px solid var(--line)}
@media (max-width:760px){.nav,.top .btn{display:none}.burger{display:grid;place-items:center}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--ui);font-weight:600;border-radius:14px;padding:14px 22px;font-size:18px;transition:transform .1s,box-shadow .1s;text-align:center}
.btn:active{transform:translateY(3px)}
.btn-main{background:var(--paper);color:#1a1816;box-shadow:0 5px 0 #b9ab98}
.btn-main:active{box-shadow:0 2px 0 #b9ab98}
.btn-tan{background:var(--tan);color:#1a1816;box-shadow:0 5px 0 var(--brown)}
.btn-ember{background:var(--ember);color:#1a1816;box-shadow:0 5px 0 #a3421f}
.btn-ghost{background:var(--card);border:1px solid var(--line)}
.btn-sm{padding:9px 14px;font-size:15px;border-radius:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;padding-block:34px 26px}
.eyebrow{color:var(--tan);font-family:var(--ui);font-weight:600;font-size:15px;letter-spacing:.3px}
.hero h1{font-family:var(--poster);font-size:clamp(64px,15vw,118px);font-weight:700;line-height:.88;margin-block:12px 18px;letter-spacing:.5px}
.hero h1 .l2{color:var(--ash)}
.hero h1 .l3{color:var(--tan)}
.lead{font-size:18px;color:var(--muted);max-width:52ch}
.cta-stack{display:grid;gap:12px;margin-top:22px;max-width:440px}
.join{border:1px solid var(--line);background:var(--bg2);border-radius:14px}
.join summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;font-family:var(--ui);font-weight:600;cursor:pointer}
.join summary::-webkit-details-marker{display:none}
.join summary .chev{margin-inline-start:auto;transition:transform .2s}
.join[open] summary .chev{transform:rotate(180deg)}
.join form{display:flex;gap:8px;padding:0 12px 12px}
.codein{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);letter-spacing:6px;text-align:center;text-transform:uppercase;font-family:var(--ui);font-weight:700;direction:ltr}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-family:var(--ui);font-weight:500;font-size:14px;color:var(--muted)}
.checks span::before{content:"✓";color:var(--tan);margin-inline-end:6px}
.stage{position:relative;display:grid;place-items:center;aspect-ratio:1/1.05;max-width:100%}
.stage .spot{position:absolute;inset:6% 10% 0;border-radius:50%;background:radial-gradient(circle at 50% 45%,#f2ede614,transparent 62%)}
.stage .floor{position:absolute;bottom:6%;width:70%;height:12%;border-radius:50%;background:radial-gradient(#8b5e3c44,transparent 70%)}
.chip{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-family:var(--ui);font-weight:600;font-size:13px;box-shadow:0 10px 24px #0007;white-space:nowrap}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-top:16px}.stage{order:-1;width:min(290px,78%);margin:0 auto}}

/* sigi */
.sigi{display:block;width:100%;height:auto;overflow:visible}
.sigi .smoke{animation:drift 4s ease-in-out infinite;transform-origin:60px 30px}
.sigi .ember{animation:glow 2.4s ease-in-out infinite}
@keyframes drift{50%{transform:translate(3px,-4px) scale(1.05);opacity:.5}}
@keyframes glow{50%{opacity:.75}}

/* sections */
section.block{padding-block:40px}
.sec-head{display:flex;align-items:end;gap:12px;margin-bottom:16px}
.sec-head h2{font-family:var(--poster);font-size:clamp(44px,9vw,64px);font-weight:700;letter-spacing:.5px}
.sec-head .more{margin-inline-start:auto;color:var(--tan);font-family:var(--ui);font-weight:600;text-decoration:none;white-space:nowrap}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-block:1px solid var(--line);padding-block:18px}
.trio div{display:flex;gap:12px;align-items:center}
.trio i{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:22px;background:var(--card)}
.trio b{display:block;font-family:var(--ui);font-weight:600;font-size:17px}
.trio small{color:var(--muted);font-size:14px}
@media (max-width:640px){.trio{grid-template-columns:1fr}}
.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{height:6px}.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.gtile{flex:none;width:148px;scroll-snap-align:start;border-radius:16px;padding:12px;background:var(--card);border:1px solid var(--line);text-align:start;display:grid;gap:8px}
.gtile .art{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:50px;background:var(--card2);max-width:100%}
.gtile b{font-family:var(--ui);font-weight:600;font-size:16px}
.gtile small{color:var(--muted);font-size:13px}
.steps{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);padding:0;margin:0;counter-reset:s}
.steps li{list-style:none;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;counter-increment:s;display:grid;gap:6px}
.steps li::before{content:counter(s);font-family:var(--poster);font-size:40px;line-height:1;color:var(--tan)}
.steps h3{font-family:var(--ui);font-weight:600;font-size:19px}
.steps p{color:var(--muted)}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.demo{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:8px;max-width:520px;margin-inline:auto;width:100%}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.modes div{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start}
.modes i{font-style:normal;font-size:28px}
.modes b{font-family:var(--ui);font-weight:600;font-size:17px}
.modes p{color:var(--muted);font-size:15px}
@media (max-width:860px){.modes{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.cat{margin-bottom:28px}
.cat h3{font-family:var(--ui);font-weight:600;font-size:21px;margin-bottom:4px}
.cat>p{color:var(--muted);margin-bottom:12px;max-width:60ch}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.gcard{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px}
.gcard .art{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:28px;background:var(--card2)}
.gcard div{min-width:0}
.gcard b{font-family:var(--ui);font-weight:600;font-size:16px}
.gcard p{font-size:14px;color:var(--muted)}
.pl{font-size:13px;color:var(--tan);font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-inline-start:6px;vertical-align:middle;background:#ffffff10;color:var(--muted)}
.tag.live{background:#8fb39a26;color:var(--ok)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{padding:16px 2px;font-family:var(--ui);font-weight:600;font-size:17px;cursor:pointer;list-style:none;display:flex;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-inline-start:auto;color:var(--tan);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq details p{padding:0 2px 16px;color:var(--muted);max-width:65ch}
.final{text-align:center;display:grid;gap:12px;justify-items:center;background:var(--bg2);border-radius:26px;padding:30px 18px;border:1px solid var(--line)}
.final h2{font-family:var(--poster);font-size:clamp(48px,10vw,72px)}
footer{padding-block:26px;color:var(--muted);font-size:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}

/* app screens */
.screen{padding-block:14px 48px;display:grid;gap:14px;align-content:start;max-width:560px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.bar .back{color:var(--muted);font-family:var(--ui);font-weight:600;display:flex;gap:6px;align-items:center;padding:6px 0}
.bar .spacer{flex:1}
.bar .title{font-family:var(--ui);font-weight:600;font-size:17px}
.codechip{font-family:var(--ui);font-weight:700;letter-spacing:3px;direction:ltr;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px}
.hostbar{display:flex;gap:8px;flex-wrap:wrap}
.say{display:flex;gap:10px;align-items:center}
.say .face{flex:none;width:64px}
.say .bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 14px;font-weight:600;line-height:1.4;flex:1;min-width:0}
.say .bubble::before{content:"";position:absolute;top:50%;right:-7px;width:12px;height:12px;background:var(--card);border-right:1px solid var(--line);border-top:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.say .bubble small{display:block;color:var(--tan);font-family:var(--ui);font-weight:600;font-size:12px;margin-bottom:2px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.panel h2{font-family:var(--ui);font-weight:600;font-size:22px}
.h{font-family:var(--ui);font-weight:600;font-size:17px;margin-top:4px}
.field{display:flex;gap:8px}
.txt{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);font-size:17px}
.plist{display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 12px;min-height:50px}
.prow.me{box-shadow:inset 0 0 0 1px var(--tan)}
.prow.off{opacity:.45}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--ui);font-weight:700;color:#1a1816;flex:none}
.prow .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.prow .nm small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.prow .rt{font-family:var(--ui);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.prow .x{color:var(--muted);padding:6px 8px;font-size:14px}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:#ffffff10;color:var(--muted);white-space:nowrap}
.pill.ok{background:#8fb39a26;color:var(--ok)}
.pill.bad{background:#d46a6a26;color:var(--bad)}
.pill.turn{background:#c8955a26;color:var(--tan)}
.choices{display:grid;gap:8px}
.choice{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:start;font-weight:700;font-size:17px;min-height:54px}
.choice small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.choice.sel{border-color:var(--tan);background:#c8955a1f}
.choice[disabled]{opacity:.4}
.pickgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pick{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:start;display:grid;gap:2px}
.pick .art{font-size:30px}
.pick b{font-family:var(--ui);font-weight:600;font-size:16px}
.pick small{color:var(--muted);font-size:12px}
.pick.off{opacity:.4}
.big{font-family:var(--ui);font-weight:700;font-size:clamp(26px,7vw,36px);text-align:center;line-height:1.15;overflow-wrap:anywhere}
.big small{display:block;font-family:var(--body);font-weight:600;font-size:15px;color:var(--muted);margin-top:4px}
.secret{border-radius:20px;padding:22px 16px;text-align:center;display:grid;gap:6px;justify-items:center;min-height:150px;align-content:center;width:100%}
.secret .t{color:var(--muted);font-weight:600;font-size:14px}
.secret .w{font-family:var(--ui);font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1.15;overflow-wrap:anywhere}
.secret.word{background:var(--paper);color:#1a1816}
.secret.word .t{color:#6b625a}
.secret.imp{background:#3a1f16;border:2px solid var(--ember)}
.secret.cover{background:repeating-linear-gradient(45deg,var(--card) 0 12px,var(--bg2) 12px 24px);border:1px dashed var(--line)}
.timer{font-family:var(--poster);font-size:84px;line-height:.9;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{color:var(--ember)}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:70px;align-items:center}
.pc{min-width:48px;height:68px;padding:0 6px;border-radius:9px;background:var(--paper);color:#1a1816;display:grid;place-items:center;font-family:var(--ui);font-size:24px;font-weight:700;box-shadow:0 4px 0 #0006;animation:pop .25s}
.pc.small{min-width:42px;height:56px;font-size:18px}
.pc.dup{background:var(--bad);color:#fff}
.pc:has(small){align-content:center;gap:2px;line-height:1}
.pc small{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:#6b625a;line-height:1}
.pc.back{background:repeating-linear-gradient(45deg,var(--brown) 0 6px,var(--tan) 6px 12px);box-shadow:0 4px 0 #0006,inset 0 0 0 3px var(--paper)}
.pc.tap{cursor:pointer;outline:2px solid transparent}
.pc.tap:active{transform:translateY(3px)}
.pc.tap:hover{outline-color:var(--tan)}
.pc.dim{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tile{display:grid;place-items:center;min-height:52px;padding:4px 2px;border-radius:9px;background:var(--paper);color:#1a1816;font-weight:700;font-size:clamp(11px,3.3vw,15px);text-align:center;line-height:1.1;overflow-wrap:anywhere;border:3px solid transparent}
button.tile{cursor:pointer}
button.tile:active{transform:scale(.96)}
.spy .tile.k-A{border-color:#8a847d}.spy .tile.k-B{border-color:var(--brown)}.spy .tile.k-X{border-color:#000;background:#d9cfc2}
.tile.open.k-A{background:#8a847d;color:var(--paper)}
.tile.open.k-B{background:var(--brown);color:var(--paper)}
.tile.open.k-N{background:#4a4540;color:#a39b91}
.tile.open.k-X{background:#000;color:var(--ember)}
.tile.open{opacity:.9}
@keyframes pop{from{transform:translateY(-12px) rotate(-6deg);opacity:0}}
.list{display:grid;gap:6px}
.li{display:flex;gap:8px;align-items:baseline;background:var(--card);border-radius:10px;padding:8px 12px}
.li b{flex:none;max-width:45%;overflow-wrap:anywhere}
.li span{min-width:0;overflow-wrap:anywhere}
.li.ok{box-shadow:inset 0 0 0 1px var(--ok)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;align-self:center}
.codebox{display:grid;gap:10px;justify-items:center;text-align:center;background:var(--card);border-radius:18px;padding:16px}
.codebox .c{font-family:var(--ui);font-weight:700;font-size:48px;letter-spacing:10px;direction:ltr;line-height:1}
.codebox .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bombart{font-size:96px;text-align:center;line-height:1}
.bombart.live{animation:tick .45s infinite alternate}
@keyframes tick{to{transform:scale(1.08) rotate(5deg)}}
.boomart{font-size:110px;text-align:center;line-height:1;animation:pop .3s}
.nightart{text-align:center;font-size:56px;line-height:1}
.crown{text-align:center;display:grid;gap:6px;justify-items:center}
.crown .names{font-family:var(--poster);font-size:clamp(56px,14vw,88px);line-height:.9;color:var(--tan)}
.meme{background:var(--paper);color:#1a1816;border-radius:18px;padding:18px;text-align:center;display:grid;gap:8px}
.meme .e{font-size:54px;line-height:1}
.meme p{font-weight:700;font-size:18px}
.react{display:grid;gap:10px}
.rcard{background:var(--card);border-radius:14px;padding:12px;display:grid;gap:10px}
.rcard p{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.rbtns{display:flex;gap:8px}
.rbtns button{flex:1;font-size:26px;padding:8px 0;border-radius:12px;background:var(--bg2);border:2px solid var(--line)}
.rbtns button.sel{border-color:var(--tan);background:#c8955a26}
.slider{direction:ltr;display:grid;gap:10px}
.slider .labels{display:flex;justify-content:space-between;font-family:var(--ui);font-weight:600;font-size:16px}
.track{position:relative;height:54px;border-radius:14px;background:linear-gradient(90deg,#3a3f46,var(--card2) 50%,#4a3424);border:1px solid var(--line);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;transform:translateX(-50%)}
.zone.z2{background:#c8955a33}.zone.z3{background:#c8955a55}.zone.z4{background:#e8673a99}
.mark{position:absolute;top:6px;transform:translateX(-50%);display:grid;justify-items:center;font-size:11px;font-weight:700}
.mark i{width:14px;height:14px;border-radius:50%;border:2px solid #1a1816}
.slider input[type=range]{width:100%;accent-color:var(--tan);height:36px}
.cvwrap{display:grid;gap:8px}
.cvwrap canvas{width:100%;aspect-ratio:1;max-width:100%;background:#f2ede6;border-radius:16px;touch-action:none;display:block}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;direction:ltr}
.tools .sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.tools .sw.sel{border-color:var(--paper);transform:scale(1.12)}
.tools .wd{width:34px;height:30px;border-radius:8px;background:var(--card);display:grid;place-items:center}
.tools .wd.sel{background:var(--card2);outline:2px solid var(--tan)}
.toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.toggle .tg-txt{flex:1;min-width:0;display:grid;gap:2px}
.toggle .tg-txt b{font-family:var(--ui);font-weight:600;font-size:16px}
.toggle .tg-txt small{color:var(--muted);font-size:13px;line-height:1.3}
.tg-sw{flex:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.tg-sw i{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--ash);transition:transform .2s,background .2s}
.toggle.on .tg-sw{background:var(--tan)}
.toggle.on .tg-sw i{transform:translateX(-20px);background:var(--paper)}
.roll{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#121110e6;backdrop-filter:blur(6px);padding:max(16px,env(safe-area-inset-left,0px))}
.roll-card{display:grid;justify-items:center;gap:6px;text-align:center}
.roll-face{width:90px}
.roll-icon{font-size:96px;line-height:1.1}
.roll-name{font-family:var(--poster);font-size:clamp(48px,13vw,76px);line-height:1;color:var(--paper)}
.roll.done .roll-icon{animation:pop .35s}
.roll.done .roll-name{color:var(--tan);animation:pop .35s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:#1a1816;font-weight:700;padding:12px 18px;border-radius:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px #000a}
.netbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;background:var(--ember);color:#1a1816;text-align:center;font-weight:700;font-size:14px;padding:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- state ---------- */
const SKEY = 'sigaznu.session';
let session = store.get(SKEY) || null;        // {code, token, name}
let token = (session && session.token) || store.get('sigaznu.token') || (Math.random().toString(36).slice(2) + Date.now().toString(36));
store.set('sigaznu.token', token);
let view = null, me = null, offset = 0;
let screen = 'home', menuOpen = false, prefillCode = '';
const revealed = {};
let ws = null, wsReady = false, queue = [], retry = 0, wantConnected = false;

const pathCode = location.pathname.replace(/\//g, '').toUpperCase();
if (/^[A-Z]{4}$/.test(pathCode)) { prefillCode = pathCode; if (!session || session.code !== pathCode) screen = 'join'; }

/* ---------- networking ---------- */
function connect() {
  wantConnected = true;
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => {
    wsReady = true; retry = 0; netbar(false);
    if (session && session.code) ws.send(JSON.stringify({ type: 'join', code: session.code, name: session.name, token }));
    queue.splice(0).forEach(m => ws.send(JSON.stringify(m)));
  };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); };
  ws.onclose = () => {
    wsReady = false;
    if (!wantConnected) return;
    netbar(true);
    setTimeout(connect, Math.min(8000, 500 * Math.pow(2, retry++)));
  };
}
function send(m) { if (wsReady) ws.send(JSON.stringify(m)); else { queue.push(m); connect(); } }
function netbar(on) {
  let b = $('.netbar');
  if (on && !b && screen === 'room') { b = document.createElement('div'); b.className = 'netbar'; b.textContent = 'החיבור נפל. מתחברים מחדש…'; document.body.appendChild(b); }
  if (!on && b) b.remove();
}
function onMsg(m) {
  if (m.type === 'joined') {
    session = { code: m.code, token, name: (session && session.name) || pendingName };
    store.set(SKEY, session); me = m.you; screen = 'room';
    if (location.pathname !== '/' + m.code) history.replaceState(null, '', '/' + m.code);
  } else if (m.type === 'view') {
    offset = m.now - Date.now(); view = m.view; me = view.me;
    if (screen !== 'room') screen = 'room';
    render();
  } else if (m.type === 'error') {
    toast(m.msg);
    if (m.code === 'noroom' && session) { session = null; store.set(SKEY, null); history.replaceState(null, '', '/'); screen = 'join'; render(); }
  } else if (m.type === 'toast') {
    toast(m.msg);
  } else if (m.type === 'kicked') {
    toast(m.msg); leaveLocal();
  } else if (m.type === 'stroke') { cv.add(m); }
  else if (m.type === 'strokes') { cv.replace(m.canvas, m.strokes); }
}
function leaveLocal() {
  session = null; store.set(SKEY, null); view = null; screen = 'home';
  history.replaceState(null, '', '/'); render();
}
let pendingName = '';

/* ---------- toast ---------- */
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }

/* ---------- render ---------- */
function render() {
  if (screen === 'room' && view) return renderRoom();
  app.innerHTML = screen === 'create' ? createView() : screen === 'join' ? joinView() : home();
  if (screen === 'home') animateDemo();
}

/* ---------- room ---------- */
function renderRoom() {
  // keep typed text and focus across re-renders
  const prevIn = document.querySelector('[data-input]');
  const keep = prevIn ? { act: prevIn.dataset.input, value: prevIn.value, focus: document.activeElement === prevIn } : null;
  const v = view;
  const top = `<div class="bar">
      ${v.screen === 'game' && v.host ? `<button class="back" data-act="quit">✕ ללובי</button>` : `<button class="back" data-go="leave">✕ יציאה</button>`}
      <span class="spacer"></span><span class="title">${esc(v.title)}</span><span class="codechip">${esc(v.code)}</span></div>
      ${v.canSkip ? `<div class="hostbar"><button class="btn btn-ghost btn-sm" data-act="skip">⏭ דילוג / המשך (מארח)</button></div>` : ''}`;
  app.innerHTML = `<main class="wrap"><div class="screen">${top}${v.blocks.filter(Boolean).map(renderBlock).join('')}</div></main>`;
  if (keep) {
    const nin = document.querySelector(`[data-input="${keep.act}"]`);
    if (nin && !justSent) { nin.value = keep.value; if (keep.focus) nin.focus(); }
    else if (nin && keep.focus) nin.focus();
  }
  justSent = false;
  const auto = document.querySelector('[data-autofocus]'); if (auto && !keep) auto.focus({ preventScroll: true });
  cv.mount();
  tickTimers();
  if (v.blocks.some(b => b && b.t === 'boom')) buzz('boom' + v.title + JSON.stringify(v.blocks[1]));
  if (v.rolled && v.screen === 'game' && !shownRolls.has(v.rolled.at) && Date.now() + offset - v.rolled.at < 8000) { shownRolls.add(v.rolled.at); showRoll(v.rolled); }
}

/* ---------- random draw reveal ---------- */
const shownRolls = new Set();
function showRoll(r) {
  const pool = GAMES.filter(g => g.id !== r.id);
  const el = document.createElement('div'); el.className = 'roll';
  el.innerHTML = `<div class="roll-card"><div class="roll-face">${sigi()}</div><div class="roll-icon">🎲</div><div class="roll-name">סיגי מגריל…</div></div>`;
  document.body.appendChild(el);
  const icon = el.querySelector('.roll-icon'), name = el.querySelector('.roll-name');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let k = 0, delay = 70;
  const spin = () => {
    if (reduce || k > 14) { icon.textContent = r.icon; name.textContent = r.name; el.classList.add('done'); setTimeout(() => el.remove(), 1700); return; }
    const g = pool[(k * 7) % pool.length]; icon.textContent = g.icon; name.textContent = g.name;
    k++; delay *= 1.15; setTimeout(spin, delay);
  };
  spin();
  el.addEventListener('click', () => el.remove());
}
let justSent = false;
const buzzed = new Set();
function buzz(key) { if (buzzed.has(key)) return; buzzed.add(key); try { navigator.vibrate && navigator.vibrate([200, 80, 300]); } catch (e) {} }

const avatar = (name, color) => `<span class="av" style="background:${esc(color)}">${esc(String(name || '?').slice(0, 1))}</span>`;

function renderBlock(b) {
  switch (b.t) {
    case 'say': return sayHTML(b.text);
    case 'h': return `<div class="h">${esc(b.text)}</div>`;
    case 'text': return `<p class="${b.muted ? 'muted' : ''}" style="text-align:center">${esc(b.text)}</p>`;
    case 'big': return `<div class="big">${esc(b.text)}${b.sub ? `<small>${esc(b.sub)}</small>` : ''}</div>`;
    case 'timer': return `<div class="timer" data-end="${b.end}">--</div>`;
    case 'buttons': return `<div class="pickgrid" style="grid-template-columns:repeat(${Math.min(b.items.length, 2)},1fr);padding-bottom:4px">${b.items.map(it =>
      `<button class="btn btn-${it.style || 'main'}" data-act="${esc(it.act)}" ${it.disabled ? 'disabled' : ''}>${esc(it.label)}</button>`).join('')}</div>`;
    case 'input': return `<form class="field" data-form="act" data-act="${esc(b.act)}" ${b.id ? `data-id="${esc(b.id)}"` : ''}><input class="txt" data-input="${esc(b.act)}" maxlength="${b.max || 40}" placeholder="${esc(b.placeholder)}" autocomplete="off" enterkeyhint="send" ${b.focus ? 'data-autofocus' : ''}><button class="btn btn-main btn-sm">${esc(b.button || 'שליחה')}</button></form>`;
    case 'choices': {
      const isSel = id => Array.isArray(b.selected) ? b.selected.includes(id) : b.selected === id;
      return `<div class="choices">${b.items.map(it => `<button class="choice ${isSel(it.id) ? 'sel' : ''}" data-act="${esc(b.act)}" data-id="${esc(it.id)}" ${it.disabled ? 'disabled' : ''}>
      ${it.color ? avatar(it.name, it.color) : ''}<span>${esc(it.name)}${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span>${isSel(it.id) ? '<span style="margin-inline-start:auto">✔</span>' : ''}</button>`).join('')}</div>`;
    }
    case 'toggle': return `<button class="toggle ${b.on ? 'on' : ''}" data-act="${esc(b.act)}" role="switch" aria-checked="${b.on ? 'true' : 'false'}">
      <span class="tg-txt"><b>${esc(b.label)}</b>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}</span><span class="tg-sw"><i></i></span></button>`;
    case 'hand': return `<div class="cards">${b.items.map(c => b.act && !c.disabled
      ? `<button class="pc ${c.back ? 'back' : ''} tap" data-act="${esc(b.act)}" data-id="${esc(c.id)}">${c.back ? '' : esc(c.v)}${c.sub ? `<small>${esc(c.sub)}</small>` : ''}</button>`
      : `<span class="pc ${c.back ? 'back' : ''} ${c.disabled ? 'dim' : ''}">${c.back ? '' : esc(c.v)}${c.sub ? `<small>${esc(c.sub)}</small>` : ''}</span>`).join('')}</div>`;
    case 'grid': return `<div class="grid ${b.spy ? 'spy' : ''}">${b.items.map(c => {
      const cls = `tile ${c.k ? 'k-' + c.k : ''} ${c.open ? 'open' : ''}`;
      return b.act && !c.open ? `<button class="${cls}" data-act="${esc(b.act)}" data-id="${esc(c.id)}">${esc(c.text)}</button>` : `<span class="${cls}">${esc(c.text)}</span>`;
    }).join('')}</div>`;
    case 'players': return `<div class="plist">${b.items.map((p, i) => `<div class="prow ${p.id === me ? 'me' : ''} ${p.off ? 'off' : ''}">
      ${view.screen === 'lobby' || view.screen === 'end' ? `<span class="muted" style="width:24px">#${i + 1}</span>` : ''}${avatar(p.name, p.color)}
      <span class="nm">${esc(p.name)}${p.host ? ' 👑' : ''}${p.id === me ? ' <span class="muted">(אני)</span>' : ''}${p.sub || p.off ? `<small>${p.off ? 'מנותק/ת' : esc(p.sub)}</small>` : ''}</span>
      ${p.tag ? `<span class="pill ${esc(p.tone || '')}">${esc(p.tag)}</span>` : ''}
      ${p.right !== undefined && p.right !== '' ? `<span class="rt">${esc(p.right)}</span>` : ''}
      ${b.kick && p.id !== me ? `<button class="x" data-act="kick" data-id="${esc(p.id)}" aria-label="הוצאת ${esc(p.name)}">✕</button>` : ''}</div>`).join('')}</div>`;
    case 'list': return b.items.length ? `<div class="list">${b.items.map(it => `<div class="li ${it.tone === 'ok' ? 'ok' : ''}"><span class="dot" style="background:${esc(it.color || '#888')}"></span><b>${esc(it.name)}</b><span>${esc(it.text)}</span></div>`).join('')}</div>` : '';
    case 'cards': return `<div class="cards">${b.items.length ? b.items.map(c => `<span class="pc ${c.dup ? 'dup' : ''} ${c.small ? 'small' : ''}">${esc(c.v)}</span>`).join('') : `<span class="muted">${esc(b.empty || '')}</span>`}</div>`;
    case 'secret': {
      const key = (b.title || '') + '|' + b.text;
      if (b.hidden && !revealed[key]) return `<button class="secret cover" data-reveal="${esc(key)}"><span class="t">${esc(b.title || '')}</span><span class="w" style="font-size:22px">👀 הקישו כדי לראות</span><span class="t">ודאו שאף אחד לא מציץ</span></button>`;
      return `<div class="secret ${b.tone === 'imp' ? 'imp' : 'word'}" ${b.hidden ? `data-reveal="${esc(key)}" role="button" tabindex="0"` : ''}>${b.title ? `<span class="t">${esc(b.title)}</span>` : ''}<span class="w">${esc(b.text)}</span>${b.sub ? `<span class="t">${esc(b.sub)}</span>` : ''}${b.hidden ? '<span class="t">הקישו כדי להסתיר</span>' : ''}</div>`;
    }
    case 'code': {
      const link = location.origin + '/' + b.code;
      return `<div class="codebox"><span class="muted">קוד החדר</span><span class="c">${esc(b.code)}</span><span class="muted" style="direction:ltr;font-size:14px;overflow-wrap:anywhere">${esc(link)}</span>
        <div class="row"><button class="btn btn-tan btn-sm" data-go="share">📤 שליחה לחברים</button><button class="btn btn-ghost btn-sm" data-go="copy">העתקת קישור</button></div></div>`;
    }
    case 'games': return `<div class="pickgrid">${b.items.map(g => { const ok = b.enabled && b.n >= g.min && b.n <= g.max;
      return `<button class="pick ${ok ? '' : 'off'}" ${b.enabled ? `data-act="pick" data-id="${esc(g.id)}"` : ''} data-min="${g.min}" data-max="${g.max}" data-name="${esc(g.name)}"><span class="art">${g.icon}</span><b>${esc(g.name)}</b><small>${b.n < g.min ? `צריך לפחות ${g.min}` : b.n > g.max ? `עד ${g.max} שחקנים` : `${g.min}–${g.max} שחקנים`}</small></button>`; }).join('')}</div>`;
    case 'crown': return `<div class="crown"><div style="width:110px">${sigi()}</div><span class="muted">סיגי מכריז: ${b.names.length > 1 ? 'האלופים של הערב' : 'האלוף של הערב'}</span><span class="names">${b.names.map(esc).join(' & ')}</span><span class="muted">${esc(b.sub)}</span></div>`;
    case 'bomb': return `<div class="bombart ${b.live ? 'live' : ''}">💣</div>`;
    case 'boom': return `<div class="boomart">💥</div>`;
    case 'night': return b.on ? `<div class="nightart">🌙</div>` : '';
    case 'meme': return `<div class="meme"><span class="e">${esc(b.emoji)}</span><p>${esc(b.text)}</p></div>`;
    case 'react': return `<div class="react">${b.items.map(it => `<div class="rcard"><p>${esc(it.text)}</p>${it.mine ? '<span class="muted">הכיתוב שלך</span>' :
      `<div class="rbtns">${b.options.map(o => `<button class="${it.picked === o.k ? 'sel' : ''}" data-act="${esc(b.act)}" data-id="${esc(it.id)}" data-k="${esc(o.k)}" aria-label="${esc(o.k)}">${o.e}</button>`).join('')}</div>`}</div>`).join('')}</div>`;
    case 'slider': {
      const zones = b.target != null ? [[40, 'z2'], [24, 'z3'], [10, 'z4']].map(([w, c]) => `<span class="zone ${c}" style="left:${b.target}%;width:${w}%"></span>`).join('') : '';
      const marks = (b.marks || []).map(mk => `<span class="mark" style="left:${mk.v}%"><i style="background:${esc(mk.color)}"></i>${esc(mk.name)}</span>`).join('');
      const own = b.done ? `<span class="mark" style="left:${b.value}%"><i style="background:var(--paper)"></i>אני</span>` : '';
      const ctl = b.act && !b.done ? `<input type="range" min="0" max="100" value="50" id="sl" aria-label="כיוון על הסקאלה"><button class="btn btn-main btn-block" data-act="${esc(b.act)}" data-slider="sl">🎯 נעילה</button>` : '';
      return `<div class="slider"><div class="labels"><span>← ${esc(b.left)}</span><span>${esc(b.right)} →</span></div><div class="track">${zones}${marks}${own}</div>${ctl}${b.done ? '<p class="muted" style="text-align:center;direction:rtl">נעלת! מחכים לשאר…</p>' : ''}</div>`;
    }
    case 'canvas': return `<div class="cv-slot" data-canvas="${esc(b.canvas)}" data-count="${b.count}" data-can="${b.canDraw ? 1 : 0}" data-tools="${b.tools ? 1 : 0}" data-one="${b.oneStroke ? 1 : 0}" data-color="${esc(b.color || '')}"></div>`;
    default: return '';
  }
}

/* ---------- timers ---------- */
function tickTimers() {
  document.querySelectorAll('.timer[data-end]').forEach(t => {
    const left = Math.max(0, Math.ceil((Number(t.dataset.end) - (Date.now() + offset)) / 1000));
    t.textContent = left; t.classList.toggle('low', left <= 10);
  });
}
setInterval(tickTimers, 250);

/* ---------- shared canvas ---------- */
const COLORS = ['#1b1917', '#8a847d', '#f2ede6', '#c8955a', '#8b5e3c', '#e8673a', '#d9b44a', '#6fa58c', '#6f93c9', '#b07fc0', '#d46a6a'];
const cv = {
  wrap: null, el: null, ctx: null, id: null, strokes: [], color: '#1b1917', w: 4, can: false, one: false, fixed: '', drawing: null, lastFlush: 0, synced: 0,
  build() {
    this.wrap = document.createElement('div'); this.wrap.className = 'cvwrap';
    this.el = document.createElement('canvas'); this.el.width = 600; this.el.height = 600;
    this.ctx = this.el.getContext('2d'); this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
    this.tools = document.createElement('div'); this.tools.className = 'tools';
    this.wrap.append(this.el, this.tools);
    const pos = e => { const r = this.el.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
    this.el.addEventListener('pointerdown', e => {
      if (!this.can) return; e.preventDefault(); this.el.setPointerCapture(e.pointerId);
      const [x, y] = pos(e); this.drawing = { c: this.fixed || this.color, w: this.fixed ? 6 : this.w, pts: [x, y], sent: 0 };
    });
    this.el.addEventListener('pointermove', e => {
      if (!this.drawing) return; e.preventDefault();
      const [x, y] = pos(e), d = this.drawing, n = d.pts.length;
      if (Math.abs(x - d.pts[n - 2]) + Math.abs(y - d.pts[n - 1]) < 0.004) return;
      d.pts.push(x, y);
      this.seg({ c: d.c, w: d.w, pts: d.pts.slice(-4) });
      if (Date.now() - this.lastFlush > 60) this.flush(false);
    });
    const end = () => { if (!this.drawing) return; this.flush(true); const one = this.one; this.drawing = null; if (one) { this.can = false; send({ type: 'act', act: 'done' }); } };
    this.el.addEventListener('pointerup', end); this.el.addEventListener('pointercancel', end);
  },
  flush(last) {
    const d = this.drawing; if (!d) return; this.lastFlush = Date.now();
    let pts = d.pts.slice(Math.max(0, d.sent - 2));
    if (pts.length < 4) pts = pts.length === 2 ? [pts[0], pts[1], pts[0] + 0.001, pts[1]] : pts;
    if (pts.length >= 4 || last) {
      const st = { c: d.c, w: d.w, pts };
      if (pts.length >= 2) { this.strokes.push(st); send({ type: 'stroke', canvas: this.id, last: !!last, ...st }); }
      d.sent = d.pts.length;
    }
  },
  seg(st) {
    const k = this.el.width / 300, p = st.pts, c = this.ctx;
    c.strokeStyle = st.c; c.lineWidth = st.w * k; c.beginPath(); c.moveTo(p[0] * 600, p[1] * 600);
    for (let i = 2; i < p.length; i += 2) c.lineTo(p[i] * 600, p[i + 1] * 600);
    if (p.length === 2) c.lineTo(p[0] * 600 + 0.1, p[1] * 600);
    c.stroke();
  },
  redraw() { this.ctx.clearRect(0, 0, 600, 600); this.strokes.forEach(s => this.seg(s)); },
  add(m) { if (m.canvas !== this.id) return; this.strokes.push(m); this.seg(m); },
  replace(id, strokes) { if (id !== this.id) return; this.strokes = strokes.slice(); this.redraw(); },
  mount() {
    const slot = document.querySelector('.cv-slot'); if (!slot) return;
    if (!this.el) this.build();
    const id = slot.dataset.canvas, count = Number(slot.dataset.count);
    if (id !== this.id) { this.id = id; this.strokes = []; this.redraw(); this.synced = 0; }
    this.can = slot.dataset.can === '1'; this.one = slot.dataset.one === '1'; this.fixed = slot.dataset.color || '';
    if (count > this.strokes.length && Date.now() - this.synced > 1500 && !this.drawing) { this.synced = Date.now(); send({ type: 'sync' }); }
    this.el.style.cursor = this.can ? 'crosshair' : 'default';
    this.tools.innerHTML = slot.dataset.tools === '1' ? COLORS.map(c => `<button class="sw ${c === this.color ? 'sel' : ''}" style="background:${c}" data-color="${c}" aria-label="צבע"></button>`).join('') +
      [3, 8, 18].map(w => `<button class="wd ${w === this.w ? 'sel' : ''}" data-width="${w}" aria-label="עובי"><span style="width:${w}px;height:${w}px;border-radius:50%;background:var(--fg);display:block"></span></button>`).join('') +
      `<button class="btn btn-ghost btn-sm" data-act="clear" style="margin-left:auto">🧽 ניקוי</button>` : '';
    slot.appendChild(this.wrap);
  },
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const rv = t.closest('[data-reveal]');
  if (rv) { const k = rv.dataset.reveal; revealed[k] = !revealed[k]; return renderRoom(); }
  const col = t.closest('[data-color]'); if (col && col.classList.contains('sw')) { cv.color = col.dataset.color; return cv.mount(); }
  const wd = t.closest('[data-width]'); if (wd) { cv.w = Number(wd.dataset.width); return cv.mount(); }
  const go = t.closest('[data-go]');
  if (go) {
    const g = go.dataset.go;
    if (g === 'menu') { menuOpen = !menuOpen; if (go.tagName === 'A' && go.getAttribute('href') !== '#') { setTimeout(render, 0); return; } e.preventDefault(); return render(); }
    if (g === 'home') { screen = 'home'; history.replaceState(null, '', '/'); render(); return scrollTo(0, 0); }
    if (g === 'create') { menuOpen = false; screen = 'create'; render(); scrollTo(0, 0); const i = $('#cname'); if (i) i.focus(); return; }
    if (g === 'join') { e.preventDefault(); menuOpen = false; screen = 'join'; render(); return scrollTo(0, 0); }
    if (g === 'leave') { wantConnected = true; send({ type: 'leave' }); return leaveLocal(); }
    if (g === 'share' || g === 'copy') {
      const link = location.origin + '/' + view.code, txt = `בואו לשחק SIGAZNU! קוד החדר: ${view.code}`;
      if (g === 'share' && navigator.share) { navigator.share({ title: 'SIGAZNU', text: txt, url: link }).catch(() => {}); return; }
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('הקישור הועתק'), () => toast(link));
      return;
    }
  }
  const a = t.closest('[data-act]');
  if (a && a.tagName !== 'FORM') {
    if (a.classList.contains('pick') && a.classList.contains('off')) { const n = view.players.length; return toast(Number(a.dataset.min) > n ? `${a.dataset.name} צריך לפחות ${a.dataset.min} שחקנים מחוברים` : `${a.dataset.name} מתאים לעד ${a.dataset.max} שחקנים`); }
    const m = { type: 'act', act: a.dataset.act };
    if (a.dataset.id !== undefined) m.id = a.dataset.id;
    if (a.dataset.k) m.k = a.dataset.k;
    if (a.dataset.slider) m.value = Number($('#' + a.dataset.slider).value);
    send(m);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (kind === 'create') {
    const name = $('#cname').value.trim(); if (!name) return toast('כתבו שם כדי שסיגי ידע איך להכריז עליכם');
    pendingName = name; store.set('sigaznu.name', name); session = { name, token }; send({ type: 'create', name, token });
  } else if (kind === 'homejoin') {
    prefillCode = $('#homecode').value.trim().toUpperCase(); screen = 'join'; render(); const n = $('#jname'); if (n) n.focus();
  } else if (kind === 'join') {
    const code = $('#jcode').value.trim().toUpperCase(), name = $('#jname').value.trim();
    if (!/^[A-Z]{4}$/.test(code)) return toast('קוד חדר הוא 4 אותיות באנגלית');
    if (!name) return toast('כתבו שם');
    pendingName = name; store.set('sigaznu.name', name); session = { name, token };
    send({ type: 'join', code, name, token });
  } else if (kind === 'act') {
    const inp = f.querySelector('input'), value = inp.value.trim(); if (!value) return;
    justSent = true; inp.value = '';
    send({ type: 'act', act: f.dataset.act, value, ...(f.dataset.id ? { id: f.dataset.id } : {}) });
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-reveal][tabindex]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && session && session.code && (!ws || ws.readyState > 1)) connect(); });

/* ---------- boot ---------- */
if (session && session.code && screen !== 'join') { screen = 'room'; app.innerHTML = `<main class="wrap"><div class="screen">${sayHTML('מתחבר לחדר ' + session.code + '…')}</div></main>`; connect(); }
else render();
})();
</script>
</body>
</html>
