<title>SIGAZNU</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-column phone-first stage; neon party night, single dark theme by choice */
:root{
  color-scheme:dark;
  --bg:#130b24; --bg2:#1d1236; --card:#251845; --line:#3a2a63;
  --fg:#f6f1ff; --muted:#b4a6d6;
  --sun:#ffd23f; --coral:#ff5d8f; --teal:#2de2c6; --violet:#8b5cf6;
  --danger:#ff4d4d;
  --display:"Fredoka","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.55;direction:rtl;overflow-x:hidden;
  background:radial-gradient(120% 60% at 80% -10%,#3b1a6e 0%,transparent 60%),radial-gradient(90% 50% at 0% 30%,#1a2f5e55 0%,transparent 60%),var(--bg);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:10px}
input{font:inherit}
.muted{color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#130b24e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.5px;direction:ltr;
  background:linear-gradient(90deg,var(--sun),var(--coral) 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:18px;margin-inline-start:auto;font-weight:700}
.nav a{color:var(--fg);text-decoration:none;font-size:15px}
.burger{display:none;margin-inline-start:auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:600;
  border-radius:16px;padding:14px 22px;font-size:18px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--sun);color:#1b1030;box-shadow:0 6px 0 #c99a00,0 12px 30px #ffd23f40}
.btn-main:active{box-shadow:0 2px 0 #c99a00}
.btn-ghost{border:2px solid var(--line);background:var(--bg2)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 6px 0 #b8325c}
.btn-teal{background:var(--teal);color:#08241f;box-shadow:0 6px 0 #179c88}
.btn-sm{padding:9px 14px;font-size:15px;border-radius:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
@media (max-width:760px){.nav,.top .btn{display:none}.burger{display:grid;place-items:center}}
.menu{display:grid;gap:4px;padding-block:8px 14px}
.menu a{padding:10px 4px;color:var(--fg);text-decoration:none;font-weight:700;border-bottom:1px solid var(--line)}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding-block:36px 28px}
.eyebrow{color:var(--coral);font-weight:800;font-size:15px;display:flex;gap:8px;align-items:center}
.hero h1{font-size:clamp(42px,9vw,72px);font-weight:700;margin-block:10px 14px}
.hero h1 .hl{color:var(--sun)}
.hero h1 .hl2{background:linear-gradient(90deg,var(--teal),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:18px;color:var(--muted);max-width:52ch}
.cta-stack{display:grid;gap:12px;margin-top:22px;max-width:440px}
.join{border:1px solid var(--line);background:var(--bg2);border-radius:16px}
.join summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:800;cursor:pointer}
.join summary::-webkit-details-marker{display:none}
.join summary .chev{margin-inline-start:auto;transition:transform .2s}
.join[open] summary .chev{transform:rotate(180deg)}
.join form{display:flex;gap:8px;padding:0 12px 12px}
.join input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);letter-spacing:4px;text-align:center;text-transform:uppercase}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-weight:700;font-size:15px}
.checks span::before{content:"✓";color:var(--teal);margin-inline-end:6px}
.stage{position:relative;display:grid;place-items:center;aspect-ratio:1;max-width:100%}
.stage .glow{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,#8b5cf655,transparent 65%)}
.stage .ring{position:absolute;inset:4%;border:2px dashed #ffd23f55;border-radius:50%;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip-float{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:0 10px 24px #0006}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-top:18px}.stage{order:-1;width:min(300px,80%);margin:0 auto}}

/* sections */
section.block{padding-block:40px}
.sec-head{display:flex;align-items:end;gap:12px;margin-bottom:18px}
.sec-head h2{font-size:clamp(28px,6vw,40px)}
.sec-head .more{margin-inline-start:auto;color:var(--teal);font-weight:800;text-decoration:none;white-space:nowrap}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:16px}
.trio div{display:flex;gap:12px;align-items:center}
.trio i{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:24px;background:var(--card)}
.trio b{display:block;font-family:var(--display);font-size:18px}
.trio small{color:var(--muted);font-size:14px}
@media (max-width:640px){.trio{grid-template-columns:1fr}}

.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;margin-inline:-4px;padding-inline:4px}
.rail::-webkit-scrollbar{height:6px}.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.gtile{flex:none;width:150px;scroll-snap-align:start;border-radius:20px;padding:14px;background:var(--card);border:1px solid var(--line);text-align:start;display:grid;gap:8px}
.gtile .art{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:52px;max-width:100%}
.gtile b{font-family:var(--display);font-size:17px}
.gtile small{color:var(--muted);font-size:13px}

.steps{display:grid;gap:14px;counter-reset:s;grid-template-columns:repeat(2,1fr)}
.steps li{list-style:none;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;counter-increment:s;display:grid;gap:6px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:#1b1030}
.steps h3{font-size:20px}
.steps p{color:var(--muted)}
.steps ol{padding:0;margin:0}
@media (max-width:640px){.steps{grid-template-columns:1fr}}

.board{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:10px;max-width:520px;margin-inline:auto;width:100%}
.board .bubble{background:var(--card);border-radius:14px;padding:10px 14px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 14px;transition:transform .4s}
.row .rk{font-family:var(--display);color:var(--muted);width:30px}
.row .nm{font-weight:800;flex:1;min-width:0}
.row .nm small{display:block;color:var(--teal);font-weight:700;font-size:13px}
.row .pt{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.row.first{background:linear-gradient(90deg,#ffd23f26,var(--card));border:1px solid #ffd23f66}

.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.modes div{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start}
.modes i{font-style:normal;font-size:30px}
.modes b{font-family:var(--display);font-size:18px}
.modes p{color:var(--muted);font-size:15px}
@media (max-width:860px){.modes{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.modes{grid-template-columns:1fr}}

.cat{margin-bottom:28px}
.cat h3{font-size:22px;margin-bottom:4px}
.cat>p{color:var(--muted);margin-bottom:12px;max-width:60ch}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gcard{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:start}
.gcard .art{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px}
.gcard div{min-width:0}
.gcard b{font-family:var(--display);font-size:17px}
.gcard p{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;margin-inline-start:6px;vertical-align:middle}
.tag.live{background:#2de2c633;color:var(--teal)}
.tag.soon{background:#ffffff14;color:var(--muted)}
.pl{font-size:13px;color:var(--sun);font-weight:700}

.faq details{border-bottom:1px solid var(--line)}
.faq summary{padding:16px 2px;font-weight:800;font-size:17px;cursor:pointer;list-style:none;display:flex;gap:10px}
.faq summary::after{content:"+";margin-inline-start:auto;font-family:var(--display);color:var(--sun);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq details p{padding:0 2px 16px;color:var(--muted);max-width:65ch}

.final{text-align:center;display:grid;gap:14px;justify-items:center;background:linear-gradient(160deg,#3b1a6e,#251845);border-radius:28px;padding:32px 18px;border:1px solid var(--line)}
footer{padding-block:28px;color:var(--muted);font-size:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}

/* app screens */
.screen{min-height:100%;padding-block:16px 40px;display:grid;gap:16px;align-content:start;max-width:560px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px}
.bar .back{color:var(--muted);font-weight:800;display:flex;gap:6px;align-items:center;padding:6px 0}
.bar .spacer{flex:1}
.host{display:flex;gap:12px;align-items:center}
.host svg{flex:none;width:92px;height:92px}
.say{position:relative;background:var(--card);border:2px solid var(--coral);border-radius:18px;padding:12px 14px;font-weight:800;line-height:1.35}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px}
.panel h2{font-size:24px}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--fg);font-size:17px}
.plist{display:grid;gap:8px}
.pchip{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:8px 12px;font-weight:800}
.pchip .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);color:#1b1030;flex:none}
.pchip .x{margin-inline-start:auto;color:var(--muted);padding:4px 8px}
.pchip .sc{margin-inline-start:auto;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.pickgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pick{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:start;display:grid;gap:4px}
.pick .art{font-size:34px}
.pick b{font-family:var(--display);font-size:17px}
.pick small{color:var(--muted);font-size:13px}
.pick.off{opacity:.45}
.big{font-family:var(--display);font-size:clamp(30px,8vw,44px);font-weight:700;text-align:center}
.center{text-align:center;display:grid;gap:12px;justify-items:center}
.secret{border-radius:24px;padding:28px 16px;text-align:center;display:grid;gap:10px;justify-items:center;min-height:220px;align-content:center}
.secret.word{background:linear-gradient(160deg,#2de2c633,var(--card));border:2px solid var(--teal)}
.secret.imp{background:linear-gradient(160deg,#ff5d8f40,var(--card));border:2px solid var(--coral)}
.secret.cover{background:repeating-linear-gradient(45deg,var(--card) 0 14px,var(--bg2) 14px 28px);border:2px dashed var(--line)}
.timer{font-family:var(--display);font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{color:var(--coral)}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:84px}
.pc{width:52px;height:74px;border-radius:10px;background:#fff;color:#1b1030;display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:700;box-shadow:0 4px 0 #0005;animation:pop .3s}
.pc.dup{background:var(--danger);color:#fff}
@keyframes pop{from{transform:translateY(-14px) rotate(-8deg);opacity:0}}
.status{font-size:13px;font-weight:800;padding:2px 8px;border-radius:99px;background:#ffffff14;color:var(--muted)}
.status.bust{background:#ff4d4d33;color:#ff8a8a}
.status.stop{background:#2de2c633;color:var(--teal)}
.award{display:grid;gap:8px}
.award .pchip .plus{margin-inline-start:auto;color:var(--sun);font-family:var(--display);font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:800;padding:12px 18px;border-radius:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.bomb{font-size:110px;text-align:center;line-height:1}
.bomb.tick{animation:tick .5s infinite alternate}
@keyframes tick{to{transform:scale(1.08) rotate(4deg)}}
.crown{font-size:70px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random()*n);

const COLORS = ['#ffd23f','#ff5d8f','#2de2c6','#a78bfa','#fb923c','#60a5fa','#f472b6','#4ade80'];

  <rect x="92" y="70" width="8" height="26" rx="4" fill="#1b1030" transform="rotate(-25 96 83)"/>
  <circle cx="100" cy="66" r="8" fill="#2de2c6"/>
</svg>`;

/* ---------- content ---------- */
const GAMES = [
  {id:'imposter', name:'המתחזה', icon:'🕵️', bg:'#ff5d8f33', min:3, max:12, cat:'bluff', live:true,
   d:'כולם מקבלים את אותה מילה חוץ מאחד. כל אחד אומר רמז, ואז מצביעים מי מזייף.'},
  {id:'seven', name:'שבע בר מזל', icon:'🎰', bg:'#ffd23f33', min:2, max:10, cat:'cards', live:true,
   d:'מושכים קלפים ואוספים נקודות. קלף כפול ואתם בחוץ, שבעה קלפים שונים ובונוס ענק.'},
  {id:'bomb', name:'פצצה מתקתקת', icon:'💣', bg:'#fb923c33', min:3, max:12, cat:'party', live:true,
   d:'קטגוריה על המסך והפצצה בידיים שלכם. עונים, מעבירים הלאה, ומקווים שלא תתפוצץ אצלכם.'},
  {id:'mime', name:'פנטומימה', icon:'🎭', bg:'#2de2c633', min:3, max:16, cat:'words', live:true,

  {id:'race', name:'ספרינט מילים', icon:'⏱️', bg:'#ffd23f33', min:4, max:16, cat:'words',

  {id:'scale', name:'בין הקצוות', icon:'📏', bg:'#2de2c633', min:2, max:12, cat:'words',

  {id:'stash', name:'אוצר או כלוב', icon:'💎', bg:'#a78bfa33', min:3, max:8, cat:'cards',

  {id:'meme', name:'מפעל הממים', icon:'😂', bg:'#f472b633', min:3, max:14, cat:'party',
   d:'כותבים כיתוב מצחיק לתמונה, וכל החדר מדרג.'},
  {id:'dare', name:'אתגר מהכובע', icon:'🎩', bg:'#fb923c33', min:2, max:20, cat:'party',

];
const CATS = [
  {id:'cards', name:'קלפים ומזל', d:'כל החלטה היא הימור קטן: למשוך עוד, לעצור, או להעז.'},

const KEY = 'sigaznu.v1';
let S = load() || fresh();
function fresh(){ return {view:'home', players:[], scores:{}, gamesPlayed:0, game:null, menu:false, joinErr:''}; }
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let timer = null;
function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }
function go(view){ stopTimer(); S.view = view; S.menu = false; save(); render(); window.scrollTo(0,0); }
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const P = id => S.players.find(p => p.id === id);
const av = p => `<span class="av" style="background:${p.color}">${esc(p.name.slice(0,1))}</span>`;
const sorted = () => S.players.slice().sort((a,b) => (S.scores[b.id]||0) - (S.scores[a.id]||0));

/* evening points by ranking: 3 / 2 / 1, ties share */
function rankAward(points){
  const vals = [...new Set(Object.values(points))].sort((a,b)=>b-a);
  const out = {};
  for (const id in points){ const r = vals.indexOf(points[id]); out[id] = r < 3 && points[id] > 0 ? 3 - r : 0; }
  return out;
}
function finishGame(award, note){
  for (const id in award) S.scores[id] = (S.scores[id]||0) + award[id];
  S.gamesPlayed++;
  S.game = {id:'award', award, note, from:S.game.id};
  go('game');
}

}

function startGame(id){
  const ids = S.players.map(p=>p.id);
  if (id==='imposter'){
    const cat = Object.keys(IMP_WORDS)[rnd(5)];
    S.game = {id, phase:'rules', cat, word:IMP_WORDS[cat][rnd(10)], imp:ids[rnd(ids.length)], order:shuffle(ids), i:0, shown:false, vote:null};
  } else if (id==='seven'){
    S.game = {id, phase:'rules', round:1, rounds:3, deck:newDeck(), total:Object.fromEntries(ids.map(i=>[i,0])), hands:{}, st:{}, turn:0, order:shuffle(ids), last:null};
  } else if (id==='bomb'){
    S.game = {id, phase:'rules', round:1, rounds:3, booms:Object.fromEntries(ids.map(i=>[i,0])), holder:0, order:shuffle(ids), cat:null, used:[]};
  } else if (id==='mime'){
    S.game = {id, phase:'rules', order:shuffle(ids), i:0, words:shuffle(MIME_WORDS), w:0, got:Object.fromEntries(ids.map(i=>[i,0])), left:60};
  }
  go('game');
}

function gameView(){
  const g = S.game; if (!g) return lobby();
  if (g.id==='award') return awardView();
  const G = GAMES.find(x=>x.id===g.id);
  return ({imposter:impView, seven:sevenView, bomb:bombView, mime:mimeView})[g.id](g, G);
}

function awardView(){
  const g = S.game, G = GAMES.find(x=>x.id===g.from);
  const rows = S.players.slice().sort((a,b)=>g.award[b.id]-g.award[a.id]);
  return gameShell(G.name, `<div class="host">${sigi()}<div class="say">${esc(g.note)}</div></div>
    <div class="panel"><h2>נקודות ערב מהמשחק</h2><div class="award">${rows.map(p=>`<div class="pchip">${av(p)}${esc(p.name)}<span class="plus">${g.award[p.id]?'+'+g.award[p.id]:'0'}</span></div>`).join('')}</div></div>
    <button class="btn btn-main btn-block" data-act="tolobby">לטבלה ולמשחק הבא</button>`);
}

/* imposter */
function impView(g, G){
  if (g.phase==='rules') return rules(G, 'כולם יקבלו את אותה מילה סודית, חוץ ממתחזה אחד שיודע רק את הקטגוריה. מעבירים את הטלפון, כל אחד מציץ בתורו. אחר כך כל אחד אומר רמז של מילה אחת, ומצביעים מי המתחזה.');
  if (g.phase==='reveal'){
    const p = P(g.order[g.i]), isImp = p.id===g.imp;
    const card = !g.shown
      ? `<div class="secret cover"><div class="big" style="font-size:28px">${esc(p.name)}</div><p class="muted">רק ${esc(p.name)} מסתכל/ת עכשיו</p></div>
         <button class="btn btn-main btn-block" data-act="g" data-do="show">👀 הצגת המילה שלי</button>`
      : isImp
      ? `<div class="secret imp"><div style="font-size:48px">🕵️</div><div class="big">אתה המתחזה!</div><p>הקטגוריה: <b>${g.cat}</b>. תשתלב ואל תיתפס.</p></div>
         <button class="btn btn-ghost btn-block" data-act="g" data-do="hide">הסתרה והעברה הלאה</button>`
      : `<div class="secret word"><p class="muted">הקטגוריה: ${g.cat}</p><div class="big">${g.word}</div></div>
         <button class="btn btn-ghost btn-block" data-act="g" data-do="hide">הסתרה והעברה הלאה</button>`;
    return gameShell(G.name, `<p class="center muted">שחקן ${g.i+1} מתוך ${g.order.length}</p>${card}`);
  }
  if (g.phase==='talk') return gameShell(G.name, `<div class="host">${sigi()}<div class="say">כל אחד אומר רמז של מילה אחת. ${esc(P(g.order[0]).name)} מתחיל/ה, וממשיכים מסביב. אפשר לעשות שני סבבים.</div></div>
    <div class="panel center"><p class="muted">הקטגוריה</p><div class="big">${g.cat}</div></div>
    <button class="btn btn-coral btn-block" data-act="g" data-do="vote">🗳️ להצבעה</button>`);
  if (g.phase==='vote') return gameShell(G.name, `<div class="panel"><h2>על מי רוב החדר הצביע?</h2><p class="muted">סופרים אצבעות בקול, ובוחרים כאן את מי שקיבל הכי הרבה קולות.</p>
    <div class="plist">${S.players.map(p=>`<button class="pchip" data-act="g" data-do="accuse" data-id="${p.id}">${av(p)}${esc(p.name)}</button>`).join('')}</div></div>`);
  if (g.phase==='guess') return gameShell(G.name, `<div class="center"><div style="font-size:56px">🎯</div><div class="big">תפסתם את ${esc(P(g.imp).name)}!</div>
    <p class="muted">הזדמנות אחרונה: ${esc(P(g.imp).name)} מנחש/ת בקול מה המילה.</p></div>
    <div class="panel center"><p class="muted">המילה הייתה</p><div class="big">${g.word}</div></div>
    <div class="pickgrid"><button class="btn btn-teal" data-act="g" data-do="guessed" data-ok="1">ניחש/ה נכון</button><button class="btn btn-coral" data-act="g" data-do="guessed" data-ok="0">טעה/תה</button></div>`);
}

/* seven */
function newDeck(){ const d=[0]; for(let n=1;n<=12;n++) for(let k=0;k<n;k++) d.push(n); return shuffle(d); }
function sevenActive(g){ return g.order.filter(id=>!g.st[id]); }
function sevenView(g, G){
  if (g.phase==='rules') return rules(G, 'בכל סבב מושכים קלפים בתורות. כל קלף מוסיף את הערך שלו. קיבלתם מספר שכבר יש לכם? נשרפתם, 0 לסבב. מי שאוסף 7 קלפים שונים מקבל 15 בונוס. 3 סבבים, והסכום הגבוה לוקח.');
  if (g.phase==='round'){
    const id = g.order[g.turn], p = P(id), hand = g.hands[id]||[];
    const sum = hand.reduce((a,b)=>a+b,0);
    const others = g.order.map(x=>{const h=g.hands[x]||[];const s=g.st[x];return `<div class="pchip">${av(P(x))}${esc(P(x).name)} <span class="status ${s==='bust'?'bust':s?'stop':''}">${s==='bust'?'נשרף':s==='stop'?'עצר':s==='seven'?'7!':'במשחק'}</span><span class="sc">${s==='bust'?0:h.reduce((a,b)=>a+b,0)}</span></div>`;}).join('');
    return gameShell(G.name, `<p class="center muted">סבב ${g.round} מתוך ${g.rounds}</p>
      <div class="panel center"><div class="big" style="font-size:28px">התור של ${esc(p.name)}</div>
        <div class="cards">${hand.map((c,i)=>`<span class="pc" style="animation-delay:${i===hand.length-1?0:0}s">${c}</span>`).join('') || '<span class="muted">עוד אין קלפים</span>'}</div>
        <p>בסבב: <b>${sum}</b> · ${new Set(hand).size}/7 קלפים שונים</p>
        ${g.last?`<p class="muted">${esc(g.last)}</p>`:''}
      </div>
      <div class="pickgrid"><button class="btn btn-main" data-act="g" data-do="draw">🃏 משיכה</button><button class="btn btn-ghost" data-act="g" data-do="stop" ${hand.length?'':'disabled'}>✋ עצירה</button></div>
      <div class="panel"><div class="plist">${others}</div></div>`);
  }
  if (g.phase==='bust') { const p=P(g.order[g.turn]); return gameShell(G.name, `<div class="center"><div style="font-size:64px">🔥</div><div class="big">${esc(p.name)} נשרף/ה!</div><div class="cards">${(g.hands[p.id]||[]).map((c,i,a)=>`<span class="pc ${c===a[a.length-1]&&i===a.length-1?'dup':''}">${c}</span>`).join('')}</div><p class="muted">קיבלת ${g.hands[p.id].slice(-1)[0]} פעמיים. 0 נקודות לסבב.</p></div>
    <button class="btn btn-main btn-block" data-act="g" data-do="next">העברה לשחקן הבא</button>`); }
  if (g.phase==='roundEnd') return gameShell(G.name, `<div class="host">${sigi()}<div class="say">סוף סבב ${g.round}! ככה זה נראה:</div></div>
    <div class="panel"><div class="plist">${g.order.slice().sort((a,b)=>g.total[b]-g.total[a]).map(id=>`<div class="pchip">${av(P(id))}${esc(P(id).name)} <span class="status">${g.st[id]==='bust'?'+0':'+'+g.gain[id]}</span><span class="sc">${g.total[id]}</span></div>`).join('')}</div></div>
    <button class="btn btn-main btn-block" data-act="g" data-do="nextRound">${g.round<g.rounds?'▶ לסבב הבא':'🏁 לתוצאות'}</button>`);
}

/* bomb */
function bombView(g, G){
  if (g.phase==='rules') return rules(G, 'תופיע קטגוריה והפצצה מתחילה לתקתק, אבל אף אחד לא יודע כמה זמן נשאר. עונים תשובה בקול ולוחצים "העברתי", ומעבירים את הטלפון לבא בתור. אצל מי שהיא מתפוצצת, הוא נפסל לסבב. 3 סבבים.');
  if (g.phase==='ready') return gameShell(G.name, `<p class="center muted">סבב ${g.round} מתוך ${g.rounds}</p><div class="bomb">💣</div>
    <p class="center">${esc(P(g.order[g.holder]).name)} מתחיל/ה עם הפצצה</p>
    <button class="btn btn-coral btn-block" data-act="g" data-do="arm">הדלקת הפתיל</button>`);
  if (g.phase==='live') return gameShell(G.name, `<div class="panel center"><p class="muted">הקטגוריה</p><div class="big">${g.cat}</div></div>
    <div class="bomb tick">💣</div>
    <p class="center" style="font-size:20px">הפצצה אצל <b>${esc(P(g.order[g.holder]).name)}</b></p>
    <button class="btn btn-main btn-block" style="padding:22px" data-act="g" data-do="pass">✔ עניתי, העברתי ל${esc(P(g.order[(g.holder+1)%g.order.length]).name)}</button>`);
  if (g.phase==='boom') return gameShell(G.name, `<div class="center"><div style="font-size:110px">💥</div><div class="big">בום! אצל ${esc(P(g.order[g.holder]).name)}</div></div>
    <button class="btn btn-main btn-block" data-act="g" data-do="nextRound">${g.round<g.rounds?'▶ סבב הבא':'🏁 לתוצאות'}</button>`);
}

/* mime */
function mimeView(g, G){
  if (g.phase==='rules') return rules(G, 'כל שחקן בתורו מקבל 60 שניות. הוא מציג מילים בלי לדבר ובלי להצביע על חפצים, וכולם מנחשים. כל מילה שניחשו שווה נקודה למציג. אפשר לדלג.');
  const p = P(g.order[g.i]);
  if (g.phase==='ready') return gameShell(G.name, `<p class="center muted">תור ${g.i+1} מתוך ${g.order.length}</p>
    <div class="secret cover"><div class="big">${esc(p.name)}</div><p class="muted">קחו את הטלפון ואל תראו לאף אחד</p></div>
    <button class="btn btn-main btn-block" data-act="g" data-do="go">▶ מוכנים, התחלה</button>`);
  if (g.phase==='live') return gameShell(G.name, `<div class="timer ${g.left<=10?'low':''}" id="mt">${g.left}</div>
    <div class="secret word"><div class="big">${g.words[g.w % g.words.length]}</div></div>
    <p class="center muted">${esc(p.name)} · ${g.got[p.id]} ניחושים</p>
    <div class="pickgrid"><button class="btn btn-teal" data-act="g" data-do="hit">✔ ניחשו!</button><button class="btn btn-ghost" data-act="g" data-do="skip">דילוג</button></div>`);
  if (g.phase==='done') return gameShell(G.name, `<div class="center"><div style="font-size:60px">⏰</div><div class="big">נגמר הזמן!</div><p>${esc(p.name)} הצליח/ה להעביר <b>${g.got[p.id]}</b> מילים.</p></div>
    <button class="btn btn-main btn-block" data-act="g" data-do="nextTurn">${g.i+1<g.order.length?'▶ לשחקן הבא':'🏁 לתוצאות'}</button>`);
}

function afterGame(){
  const g = S.game; if (!g) return;
  if (g.id==='mime' && g.phase==='live' && !timer){
    timer = setInterval(()=>{ g.left--; const t=$('#mt'); if (t){ t.textContent=g.left; t.classList.toggle('low', g.left<=10); }
      if (g.left<=0){ stopTimer(); g.phase='done'; save(); render(); } }, 1000);
  }
  if (g.id==='bomb' && g.phase==='live' && !timer){
    timer = setInterval(()=>{ g.fuse -= 250; if (g.fuse<=0){ stopTimer(); g.booms[g.order[g.holder]]++; g.phase='boom'; save(); try{navigator.vibrate&&navigator.vibrate(400);}catch(e){} render(); } }, 250);
  }
}

function gameAction(d, el){
  const g = S.game;
  if (g.id==='imposter'){
    if (d==='start') g.phase='reveal';
    else if (d==='show') g.shown=true;
    else if (d==='hide'){ g.shown=false; g.i++; if (g.i>=g.order.length) g.phase='talk'; }
    else if (d==='vote') g.phase='vote';
    else if (d==='accuse'){
      const id = el.dataset.id;
      if (id!==g.imp){
        const aw = Object.fromEntries(S.players.map(p=>[p.id, p.id===g.imp?3:0]));
        return finishGame(aw, `אוי לא! הצבעתם על ${P(id).name}, והמתחזה היה בכלל ${P(g.imp).name}. המילה הייתה "${g.word}". 3 נקודות למתחזה.`);
      }
      g.phase='guess';
    } else if (d==='guessed'){
      const ok = el.dataset.ok==='1';
      const aw = Object.fromEntries(S.players.map(p=>[p.id, ok ? (p.id===g.imp?2:0) : (p.id===g.imp?0:1)]));
      return finishGame(aw, ok ? `${P(g.imp).name} נתפס/ה אבל ניחש/ה את המילה. 2 נקודות למתחזה!` : `תפסתם את ${P(g.imp).name} והמילה נשארה סודית. נקודה לכל השאר.`);
    }
  }
  if (g.id==='seven'){
    const id = g.order[g.turn];
    const advance = () => {
      const act = sevenActive(g);
      if (!act.length) return endSevenRound(g);
      let t = g.turn; do { t = (t+1) % g.order.length; } while (g.st[g.order[t]]);
      g.turn = t; g.last = null; g.phase='round';
    };
    if (d==='start'){ g.phase='round'; }
    else if (d==='draw'){
      if (!g.deck.length) g.deck = newDeck();
      const c = g.deck.pop(), hand = (g.hands[id] = g.hands[id]||[]);
      const dup = hand.includes(c); hand.push(c);
      if (dup){ g.st[id]='bust'; g.phase='bust'; }
      else if (new Set(hand).size>=7){ g.st[id]='seven'; toast('🎉 7 קלפים שונים! +15 בונוס'); g.order.forEach(x=>{ if(!g.st[x]) g.st[x]='stop'; }); endSevenRound(g); }
      else { g.last = `${P(id).name} משך/ה ${c}. ממשיכים?`; advance(); }
    }
    else if (d==='stop'){ g.st[id]='stop'; advance(); }
    else if (d==='next'){ advance(); }
    else if (d==='nextRound'){
      if (g.round>=g.rounds) return finishGame(rankAward(g.total), 'שבע בר מזל נגמר! הנה מי שלקח נקודות ערב:');
      g.round++; g.hands={}; g.st={}; g.order.push(g.order.shift()); g.turn=0; g.last=null; g.phase='round';
    }
  }
  if (g.id==='bomb'){
    if (d==='start') g.phase='ready';
    else if (d==='arm'){ let c; do { c = BOMB_CATS[rnd(BOMB_CATS.length)]; } while (g.used.includes(c) && g.used.length<BOMB_CATS.length); g.used.push(c); g.cat=c; g.fuse=15000+rnd(30000); g.phase='live'; }
    else if (d==='pass'){ g.holder=(g.holder+1)%g.order.length; }
    else if (d==='nextRound'){
      if (g.round>=g.rounds){ const surv = Object.fromEntries(S.players.map(p=>[p.id, g.rounds-g.booms[p.id]])); return finishGame(rankAward(surv), 'הפצצה נגמרה. מי ששרד הכי הרבה סבבים לוקח נקודות:'); }
      g.round++; g.holder=(g.holder+1)%g.order.length; g.phase='ready';
    }
  }
  if (g.id==='mime'){
    if (d==='start') g.phase='ready';
    else if (d==='go'){ g.left=60; g.phase='live'; }
    else if (d==='hit'){ g.got[g.order[g.i]]++; g.w++; }
    else if (d==='skip'){ g.w++; }
    else if (d==='nextTurn'){
      if (g.i+1>=g.order.length) return finishGame(rankAward(g.got), 'פנטומימה נגמרה! הנה השחקנים הכי מובנים בחדר:');
      g.i++; g.phase='ready';
    }
  }
  save();
  if (g.phase==='live' && (d==='hit'||d==='skip'||d==='pass')){ const keep = timer; timer = null; clearInterval(keep); render(); return; }
  stopTimer(); render();
}
function endSevenRound(g){
  g.gain = {};
  g.order.forEach(id=>{ const h=g.hands[id]||[]; const s = g.st[id]==='bust' ? 0 : h.reduce((a,b)=>a+b,0) + (g.st[id]==='seven'?15:0); g.gain[id]=s; g.total[id]+=s; });
  g.phase='roundEnd';
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a==='menu'){ S.menu = !S.menu; render(); return; }
  if (a==='home') return go('home');
  if (a==='create') return go('create');
  if (a==='tolobby'){ if (S.players.length>=2){ S.game=null; go('lobby'); } return; }
  if (a==='rmp'){ S.players = S.players.filter(p=>p.id!==b.dataset.id); delete S.scores[b.dataset.id]; save(); render(); return; }
  if (a==='pick'){
    const G = GAMES.find(g=>g.id===b.dataset.id), n = S.players.length;
    if (!G.live) return toast(`${G.name} עוד בפיתוח. בקרוב!`);
    if (n<G.min) return toast(`${G.name} צריך לפחות ${G.min} שחקנים`);
    if (n>G.max) return toast(`${G.name} מתאים לעד ${G.max} שחקנים`);
    return startGame(G.id);
  }
  if (a==='g') return gameAction(b.dataset.do, b);
  if (a==='quitgame'){ S.game=null; return go('lobby'); }
  if (a==='endnight') return go('end');
  if (a==='newnight'){ S.scores={}; S.gamesPlayed=0; S.game=null; return go('lobby'); }
  if (a==='reset'){ const keep = S.players; S = fresh(); S.players = keep; return go('home'); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f==='addp'){
    const inp = $('#pname'), name = inp.value.trim();
    if (!name) return;
    if (S.players.length>=16) return toast('אפשר עד 16 שחקנים');
    if (S.players.some(p=>p.name===name)) return toast('השם הזה כבר בחדר. נסו כינוי אחר.');
    const id = 'p'+Date.now().toString(36)+rnd(99);
    S.players.push({id, name, color:COLORS[S.players.length % COLORS.length]});
    S.scores[id]=0; save(); render(); $('#pname').focus();
  }
  if (f==='join'){
    toast('הצטרפות עם קוד מכמה טלפונים עוד לא פעילה. בינתיים פותחים חדר ומשחקים על טלפון אחד.');
  }
});

render();
})();
</script>
